<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snowjelly · WebGPU</title>
</head>
<body>
  <main class="gpu-stage">
    <header class="gpu-header">
      <div>
        <h1>Snowjelly</h1>
        <p>Static WebGPU particle preview</p>
      </div>
      <ul class="gpu-legend" aria-label="Particle materials">
        <li class="gpu-jelly">Jelly</li>
        <li class="gpu-snow">Snow</li>
      </ul>
    </header>
    <canvas id="view" aria-label="A rose-colored jelly block beside a light blue snowball"></canvas>
    <div id="status" class="status" role="status"></div>
  </main>
  <script type="module" src="./src/gpu/main.ts"></script>
</body>
</html>
